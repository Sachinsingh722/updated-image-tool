<!DOCTYPE html>
<html>
<head>
    <title>Precision Fabric Mockup</title>
    <style>
        body { text-align:center; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .wrapper { display: flex; flex-direction: column; align-items: center; }
        canvas { border: 2px solid #555; cursor: crosshair; background-color: #000; max-width: 90vw; }
        .toolbar { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; flex-direction: column; align-items: flex-start; font-size: 12px; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-download { background: #2ecc71; color: white; }
    </style>
</head>
<body>

    <h2>Step 1: Draw around the bed | Step 2: Adjust Pattern</h2>

    <div class="wrapper">
        <div class="toolbar">
            <div class="control-group">
                <label>1. Images</label>
                <input type="file" id="bedInput" accept="image/*">
                <input type="file" id="patternInput" accept="image/*">
            </div>
            <div class="control-group">
                <label>2. Pattern Scale</label>
                <input type="range" id="scale" min="0.05" max="1" step="0.01" value="0.2">
            </div>
            <div class="control-group">
                <label>3. Opacity</label>
                <input type="range" id="opacity" min="0" max="1" step="0.1" value="0.7">
            </div>
            <div class="btn-group">
                <button class="btn-clear" onclick="resetPoints()">Clear Mask</button>
                <button class="btn-download" onclick="download()">Download</button>
            </div>
        </div>

        <canvas id="canvas"></canvas>
        <p><i>Click on the corners of the bed to create the area where the fabric should go.</i></p>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let bedImg = new Image();
    let patternImg = new Image();
    let points = []; // Store the mask coordinates
    
    // Upload Handlers
    document.getElementById('bedInput').onchange = (e) => loadImg(e, bedImg, true);
    document.getElementById('patternInput').onchange = (e) => loadImg(e, patternImg, false);
    
    function loadImg(e, imgObj, isBed) {
        const reader = new FileReader();
        reader.onload = (event) => {
            imgObj.src = event.target.result;
            imgObj.onload = () => {
                if(isBed) {
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;
                }
                draw();
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    // Click to draw points
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        points.push({x, y});
        draw();
    });

    function resetPoints() { points = []; draw(); }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. Draw Bed
        if (bedImg.src) ctx.drawImage(bedImg, 0, 0);

        // 2. Draw Mask UI (the red lines while drawing)
        if (points.length > 0) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // 3. Draw Pattern inside Mask
// ✅ Perspective fitting (REAL bedsheet effect)
if (patternImg.src && points.length === 4) {

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = patternImg.width;
    tempCanvas.height = patternImg.height;

    const tctx = tempCanvas.getContext("2d");
    tctx.drawImage(patternImg, 0, 0);

    const p = new Perspective(ctx, tempCanvas);

    p.draw([
        [points[0].x, points[0].y], // top-left
        [points[1].x, points[1].y], // top-right
        [points[2].x, points[2].y], // bottom-right
        [points[3].x, points[3].y]  // bottom-left
    ]);
}
        }
    }

    // Update on slider move
    document.querySelectorAll('input[type=range]').forEach(i => i.oninput = draw);

    function download() {
        const link = document.createElement('a');
        link.download = 'perfect-mockup.png';
        link.href = canvas.toDataURL();
        link.click();
    }
<script src="https://cdn.jsdelivr.net/gh/wanadev/perspective.js/dist/perspective.min.js"></script>
    
</body>
</html>
</html>
