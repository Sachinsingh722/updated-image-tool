<!DOCTYPE html>
<html>
<head>
    <title>Bed Mockup Tool (Perspective Fixed)</title>

    <!-- ✅ Working Perspective Library -->
    <script src="https://unpkg.com/perspective-transform@1.1.3/dist/perspective-transform.min.js"></script>

    <style>
        body {
            text-align:center;
            font-family: Arial;
            background:#1a1a1a;
            color:white;
        }
        canvas {
            border:2px solid #555;
            max-width:90vw;
            cursor:crosshair;
        }
        .toolbar {
            margin:15px;
        }
        input, button {
            margin:5px;
        }
    </style>
</head>

<body>

<h2>Click 4 corners of bed (TL → TR → BR → BL)</h2>

<div class="toolbar">
    <input type="file" id="bedInput">
    <input type="file" id="patternInput">
    <button onclick="reset()">Reset</button>
    <button onclick="download()">Download</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let bedImg = new Image();
let patternImg = new Image();
let points = [];

// Upload
bedInput.onchange = e => loadImg(e, bedImg, true);
patternInput.onchange = e => loadImg(e, patternImg, false);

function loadImg(e, img, isBed){
    const reader = new FileReader();
    reader.onload = ev => {
        img.src = ev.target.result;
        img.onload = () => {
            if(isBed){
                canvas.width = img.width;
                canvas.height = img.height;
            }
            draw();
        }
    };
    reader.readAsDataURL(e.target.files[0]);
}

// Click points
canvas.addEventListener('click', e => {
    if(points.length >= 4) return;

    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    points.push({x,y});
    draw();
});

function reset(){
    points = [];
    draw();
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw bed
    if(bedImg.src){
        ctx.drawImage(bedImg,0,0);
    }

    // Draw points
    if(points.length){
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for(let i=1;i<points.length;i++){
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle="red";
        ctx.lineWidth=2;
        ctx.stroke();
    }

    // ✅ Perspective mapping
    if(patternImg.src && points.length === 4){

        const w = patternImg.width;
        const h = patternImg.height;

        const src = [0,0, w,0, w,h, 0,h];
        const dst = [
            points[0].x, points[0].y,
            points[1].x, points[1].y,
            points[2].x, points[2].y,
            points[3].x, points[3].y
        ];

        const transform = perspectiveTransform(src, dst);

        // Create temp canvas
        const temp = document.createElement('canvas');
        temp.width = canvas.width;
        temp.height = canvas.height;
        const tctx = temp.getContext('2d');

        // Draw warped image manually
        for(let y=0; y<canvas.height; y++){
            for(let x=0; x<canvas.width; x++){

                const p = transform.inverse(x,y);

                if(p[0]>=0 && p[0]<w && p[1]>=0 && p[1]<h){
                    tctx.drawImage(patternImg, p[0], p[1], 1,1, x,y,1,1);
                }
            }
        }

        ctx.globalAlpha = 0.8;
        ctx.globalCompositeOperation = "multiply";

        ctx.drawImage(temp,0,0);

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
    }
}

// Download
function download(){
    const a = document.createElement('a');
    a.download = "mockup.png";
    a.href = canvas.toDataURL();
    a.click();
}

</script>

</body>
</html>
