<!DOCTYPE html>
<html>
<head>
    <title>Pro Image Layout Tool</title>
    <style>
        body { text-align:center; font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        canvas { border: 2px solid #333; margin-top: 20px; background: #eee; border-radius: 4px; }
        .controls { margin-top: 20px; display: grid; grid-template-columns: 100px 1fr; gap: 10px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; margin: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Image Layout Generator</h2>

    <label>Ref Image: <input type="file" id="ref" accept="image/*"></label><br><br>
    <label>Product Image: <input type="file" id="prod" accept="image/*"></label><hr>

    <div class="controls">
        <label>X Position:</label> <input type="range" id="posX" min="-250" max="500" value="100">
        <label>Y Position:</label> <input type="range" id="posY" min="-250" max="500" value="100">
        <label>Scale:</label> <input type="range" id="size" min="10" max="800" value="300">
        <label>Radius:</label> <input type="range" id="radius" min="0" max="100" value="20">
    </div>

    <button onclick="downloadImage()">Download Result</button><br>
    <canvas id="canvas" width="500" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let refImg = new Image();
let prodImg = new Image();
let refLoaded = false;
let prodLoaded = false;

// Event listeners for real-time updates
document.querySelectorAll('input[type=range]').forEach(input => {
    input.addEventListener('input', draw);
});

document.getElementById('ref').onchange = (e) => {
    refImg.src = URL.createObjectURL(e.target.files[0]);
    refImg.onload = () => { refLoaded = true; draw(); };
};

document.getElementById('prod').onchange = (e) => {
    prodImg.src = URL.createObjectURL(e.target.files[0]);
    prodImg.onload = () => { prodLoaded = true; draw(); };
};

function drawRoundedImage(img, x, y, w, h, r) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
}

function draw() {
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Reference Background
    if (refLoaded) {
        ctx.globalAlpha = 0.4;
        ctx.drawImage(refImg, 0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
    }

    // 2. Draw Product with Sliders
    if (prodLoaded) {
        const x = parseInt(document.getElementById("posX").value);
        const y = parseInt(document.getElementById("posY").value);
        const size = parseInt(document.getElementById("size").value);
        const radius = parseInt(document.getElementById("radius").value);
        
        // Calculate aspect ratio to prevent stretching
        const ratio = prodImg.width / prodImg.height;
        const width = size;
        const height = size / ratio;

        drawRoundedImage(prodImg, x, y, width, height, radius);
    }
}

function downloadImage() {
    const link = document.createElement('a');
    link.download = 'layout-design.png';
    link.href = canvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
