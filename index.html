<!DOCTYPE html>
<html>
<head>
    <title>Fabric Overlay Tool</title>
    <style>
        body { text-align:center; font-family: 'Segoe UI', sans-serif; background: #222; color: white; padding: 20px; }
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        canvas { border: 3px solid #444; background: #000; max-width: 100%; height: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .controls { background: #333; padding: 20px; border-radius: 12px; display: grid; grid-template-columns: 120px 250px; gap: 15px; text-align: left; }
        input[type=file] { margin-bottom: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }
        .btn-group { margin-top: 10px; }
        button { padding: 10px 25px; font-weight: bold; cursor: pointer; border-radius: 5px; border: none; background: #2ecc71; color: white; }
        button:hover { background: #27ae60; }
    </style>
</head>
<body>

    <h2>Fabric Mockup Generator</h2>

    <div class="main-container">
        <div class="controls">
            <div>Step 1: Bed Image</div>
            <input type="file" id="bedInput" accept="image/*">
            
            <div>Step 2: Pattern</div>
            <input type="file" id="patternInput" accept="image/*">

            <label>Scale Pattern:</label>
            <input type="range" id="scale" min="0.1" max="2" step="0.01" value="0.5">

            <label>Rotation:</label>
            <input type="range" id="rotation" min="0" max="360" value="0">

            <label>Fade (Opacity):</label>
            <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.8">

            <div class="btn-group">
                <button onclick="download()">Download Result</button>
            </div>
        </div>

        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let bedImg = new Image();
    let patternImg = new Image();
    let bedLoaded = false;
    let patternLoaded = false;

    // Load Bed Image (Image 2)
    document.getElementById('bedInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            bedImg.src = event.target.result;
            bedImg.onload = () => {
                canvas.width = bedImg.width;
                canvas.height = bedImg.height;
                bedLoaded = true;
                draw();
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // Load Pattern Image (Image 1)
    document.getElementById('patternInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            patternImg.src = event.target.result;
            patternImg.onload = () => {
                patternLoaded = true;
                draw();
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // Listen for slider changes
    document.querySelectorAll('input[type=range]').forEach(input => {
        input.addEventListener('input', draw);
    });

    function draw() {
        if (!bedLoaded) return;

        // 1. Draw the Bed Base
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bedImg, 0, 0);

        if (patternLoaded) {
            const scale = parseFloat(document.getElementById('scale').value);
            const rotation = parseInt(document.getElementById('rotation').value) * Math.PI / 180;
            const opacity = parseFloat(document.getElementById('opacity').value);

            ctx.save();
            
            // Set transparency so we can see the bed details underneath
            ctx.globalAlpha = opacity;
            
            // Multiply/Overlay effect (Standard for mockups)
            ctx.globalCompositeOperation = 'multiply';

            // Create a repeating pattern
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = patternImg.width * scale;
            tempCanvas.height = patternImg.height * scale;
            tempCtx.drawImage(patternImg, 0, 0, tempCanvas.width, tempCanvas.height);
            
            const pattern = ctx.createPattern(tempCanvas, 'repeat');
            
            // Apply transformation
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(rotation);
            ctx.translate(-canvas.width, -canvas.height); // Offset to cover whole area
            
            ctx.fillStyle = pattern;
            ctx.fillRect(0, 0, canvas.width * 2, canvas.height * 2);
            
            ctx.restore();
        }
    }

    function download() {
        const link = document.createElement('a');
        link.download = 'bed-mockup.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
